    x-apievangelist-note: >-
      The spec models this scheme as the `password` flow, but the documented and recommended path to
      a member token is an authorization_code exchange after Classy Login consent.
- target: $.info
  update:
    x-apievangelist-gaps:
    - No AsyncAPI document for the Svix-delivered webhook surface (6 events, 3 resources).
    - No /.well-known/openid-configuration for the Classy Login OIDC service.
    - No global Idempotency-Key header; idempotency_key exists on one batch operation only.
    - No sandbox tenant or test credentials; every write is a production write.
    - No 401/429/503 responses declared on any operation despite being documented in prose.
    - First-party SDKs (npm classy-node, Packagist classy-org/classy-php-sdk) are years stale.
