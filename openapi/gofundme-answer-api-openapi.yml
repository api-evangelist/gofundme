openapi: 3.2.0
info:
  title: GoFundMe Pro Answer API
  description: 'GoFundMe Pro API


    Welcome to the GoFundMe Pro API (2.0.0), a powerful toolset that empowers innovative and creative minds to engineer the world for good.'
  version: 2.0.0
servers:
- url: https://pro.gofundme.com/api/2.0
security:
- OAuth2Application: []
- OAuth2Member: []
tags:
- name: Answer
  description: 'Answer objects represent an answer to a Question that is associated with an answerable_type (referenced by answerable_id and answerable_type),

    supported types include: fundraising_page, fundraising_team, transaction or registration.'
paths:
  /fundraising-pages/{fundraising_page}/answers:
    get:
      tags:
      - Answer
      summary: listFundraisingPageAnswers
      description: Retrieves list of all Answers related to specified Fundraising Page
      operationId: listFundraisingPageAnswers
      parameters:
      - name: fundraising_page
        in: path
        description: The specified Fundraising Page ID
        required: true
        schema:
          type: integer
          example: 2173528
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - properties:
                    data:
                      description: Collection of Answers
                      type: array
                      items:
                        $ref: '#/components/schemas/Answer'
                    first_page_url:
                      example: '{host}/fundraising-pages/2173528/answer?page=1'
                    last_page_url:
                      example: '{host}/fundraising-pages/2173528/answer?page=1'
                    path:
                      example: '{host}/fundraising-pages/2173528/answer'
                  type: object
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Fundraising Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
    post:
      tags:
      - Answer
      summary: createFundraisingPageAnswer
      description: Create an Answer for a Fundraising Page
      operationId: createFundraisingPageAnswer
      parameters:
      - name: fundraising_page
        in: path
        description: The specified Fundraising Page ID
        required: true
        schema:
          type: integer
          example: 2173528
      requestBody:
        content:
          application/json:
            schema:
              required:
              - question_id
              allOf:
              - $ref: '#/components/schemas/AnswerFillable'
              - properties:
                  question_id:
                    description: Primary identifier of associated Question
                    type: integer
                    example: 45678
                type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Fundraising Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
      security:
      - OAuth2Member: []
  /fundraising-teams/{fundraising_team}/answers:
    get:
      tags:
