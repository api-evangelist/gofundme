        required: true
        schema:
          type: integer
          example: 209745
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - properties:
                    data:
                      description: Collection of Answers
                      type: array
                      items:
                        $ref: '#/components/schemas/Answer'
                    first_team_url:
                      example: '{host}/fundraising-teams/209745/answer?page=1'
                    last_team_url:
                      example: '{host}/fundraising-teams/209745/answer?page=1'
                    path:
                      example: '{host}/fundraising-teams/209745/answer'
                  type: object
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Fundraising Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
    post:
      tags:
      - Answer
      summary: createFundraisingTeamAnswer
      description: Create an Answer for a Fundraising Team
      operationId: createFundraisingTeamAnswer
      parameters:
      - name: fundraising_team
        in: path
        description: The specified Fundraising Team ID
        required: true
        schema:
          type: integer
          example: 209745
      requestBody:
        content:
          application/json:
            schema:
              required:
              - question_id
              allOf:
              - $ref: '#/components/schemas/AnswerFillable'
              - properties:
                  question_id:
                    description: Primary identifier of associated Question
                    type: integer
                    example: 45678
                type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Fundraising Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
  /organizations/{organization}/answers:
    get:
      tags:
      - Answer
      summary: listOrganizationAnswers
      description: Retrieves list of all Answers related to specified Organization
      operationId: listOrganizationAnswers
      parameters:
      - name: organization
        in: path
        description: The specified Organization ID
        required: true
        schema:
          type: integer
          example: 82364
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - properties:
                    data:
                      description: Collection of Answers
                      type: array
                      items:
                        $ref: '#/components/schemas/Answer'
                    first_page_url:
                      example: '{host}/organization/82364/answer?page=1'
                    last_page_url:
                      example: '{host}/organization/82364/answer?page=1'
                    path:
                      example: '{host}/organization/82364/answer'
                  type: object
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
  /questions/{question}/answers:
    get:
      tags:
      - Answer
      summary: listQuestionAnswers
      description: Retrieves list of all Answers related to specified Question
      operationId: listQuestionAnswers
      parameters:
      - name: question
        in: path
        description: The specified Question ID
        required: true
        schema:
          type: integer
          example: 45678
      - name: fields
        in: query
        description: Comma-separated list of fields to be returned
        schema:
          type: string
          enum:
          - answer
          - answerable_id
          - answerable_type
          - campaign_id
          - created_at
          - id
          - member_id
          - question_id
          - updated_at
          example: id
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - properties:
                    data:
                      description: Collection of Answers
                      type: array
                      items:
                        $ref: '#/components/schemas/Answer'
                    first_page_url:
                      example: '{host}/question/45678/answer?page=1'
                    last_page_url:
                      example: '{host}/question/45678/answer?page=1'
                    path:
                      example: '{host}/question/45678/answer'
                  type: object
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Question not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
  /registrations/{registration}/answers:
    get:
      tags:
      - Answer
      summary: listRegistrationAnswers
      description: Retrieves list of all Answers related to specified Registration
      operationId: listRegistrationAnswers
      parameters:
      - name: registration
        in: path
        description: The specified Registration ID
        required: true
        schema:
          type: integer
          example: 78345
      - name: fields
        in: query
        description: Comma-separated list of fields to be returned
        schema:
          type: string
          enum:
          - answer
          - answerable_id
          - answerable_type
          - campaign_id
          - created_at
          - id
          - member_id
          - question_id
          - updated_at
          example: id
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - properties:
                    data:
                      description: Collection of Answers
                      type: array
                      items:
                        $ref: '#/components/schemas/Answer'
                    first_page_url:
                      example: '{host}/registration/78345/answer?page=1'
                    last_page_url:
                      example: '{host}/registration/78345/answer?page=1'
                    path:
                      example: '{host}/registration/78345/answer'
                  type: object
        '403':
          description: Requester is not authorized to perform action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Registration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundResponse'
    post:
      tags:
      - Answer
      summary: createRegistrationAnswer
      description: Create an Answer for a Registration
      operationId: createRegistrationAnswer
      parameters:
      - name: registration
        in: path
        description: The specified Registration ID
        required: true
        schema:
          type: integer
          example: 78345
      requestBody:
        content:
          application/json:
            schema:
              required:
              - question_id
              allOf:
              - $ref: '#/components/schemas/AnswerFillable'
              - properties:
                  question_id:
