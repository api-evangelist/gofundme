  name: GoFundMe Promo Code API
  description: >-
    A promo code record represents a shareable string that can be used to apply a discount to the purchase
    of one or more configured ticket types for a specified campaign. The code can specify either a percentage
    of the base price or flat amount of one or more tickets. A promo code can be configured to optionally
    restrict the number of times and/or a time frame during which the promo code can be used. A code can
    also be given a general designation, meaning it has no direct configurations against one or more ticket
    types and instead applies to all ticket types for its campaign.
