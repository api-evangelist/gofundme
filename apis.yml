- aid: gofundme:gofundme-answer-api
  name: GoFundMe Answer API
  description: >-
    Answer objects represent an answer to a Question that is associated with an answerable_type (referenced
    by answerable_id and answerable_type),

    supported types include: fundraising_page, fundraising_team, transaction or registration.


    These types coincide with the location attribute of the answer’s question (referenced by question_id).

    The above answerable_type values correspond with the four possible location values which are respectively:
    page_creation, team_creation, donation_page, campaign_registration.


    This is the reason why (in addition to listing by organization, campaign, or question) answers can
    be fetched by page, team, transaction, or registration.
  humanURL: https://developers.gofundme.com/pro/docs
  baseURL: https://pro.gofundme.com/api/2.0
