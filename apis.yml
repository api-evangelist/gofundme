apis:
- name: GoFundMe Pro API
  description: >-
    REST API (v2.0) for the GoFundMe Pro (formerly Classy) fundraising platform. 290 operations across 70
    resource families — organizations, campaigns, campaign series and Studio campaigns, fundraising pages
    and teams, transactions and transaction items, supporters and members, recurring donation plans,
    designations, promo codes, ticket types and registrations, payouts, activity feeds, stories, comments,
    themes and branding, roles and reporting. JSON only, OAuth2 bearer tokens, cursor-free page/per_page
    pagination with `with`, `filter`, `sort` and `fields` query conventions.
  humanURL: https://developers.gofundme.com/pro/docs
  baseURL: https://pro.gofundme.com/api/2.0
