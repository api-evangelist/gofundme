- aid: gofundme:gofundme-fundraising-team-transfer-api
  name: GoFundMe Fundraising Team Transfer API
  description: >-
    Transfer a Fundraising Team within its Campaign/subteam infrastructure. This is done by specifying
    the team's direct parent, making it either a direct team for its Campaign or a subteam for another
    team for its Campaign.


    The endpoint requires two parameters within its post body: `new_parent_id` and `new_parent_type`.
    These parameters are used to specify the new direct parent of the Fundraising Team. At the moment,
    this can either be the Fundraising Team's Campaign itself (making it a direct team for the Campaign)
    or another Fundraising Team associated with the Fundraising Team's Campaign (making it a subteam of
    the specified team).


    <b>NOTE</b>: An error will be returned if the new parent for a Fundraising Team is currently a subteam
    of the Fundraising Team.
