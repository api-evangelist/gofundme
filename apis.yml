  name: GoFundMe Acknowledgement API
  description: >-
    An acknowledgement is a means of indicating that the member who made a transaction has been formally
    thanked. Every acknowledgement is made by the associated member, optionally on behalf of another fundraising
    entity.

    Acknowledgements should be created after a donator has been contacted via email, comment, etc.
