aid: gofundme
name: GoFundMe
description: >-
  GoFundMe is the world's largest social fundraising platform, operating both the consumer crowdfunding
  site at gofundme.com and GoFundMe Pro (formerly Classy, acquired in 2022) — the enterprise fundraising
  suite nonprofits use for donation pages, peer-to-peer campaigns, recurring giving, ticketed events and
  Giving Cart checkout. The developer surface is GoFundMe Pro: a REST API (v2.0) documented with a public
  OpenAPI 3.0 definition covering campaigns, transactions, supporters, fundraising pages and teams,
  recurring donation plans, designations, promo codes, payouts and reporting; OAuth2 client-credentials
  and member tokens; Svix-powered webhooks for supporter, transaction and recurring-plan events; a
  Classy Login OpenID Connect single-sign-on service; and Classy Pay embedded checkout. The consumer
  gofundme.com product publishes no public API.
image: https://pro.gofundme.com/wp-content/uploads/2025/04/social-share-gfm-pro.png
url: https://raw.githubusercontent.com/api-evangelist/gofundme/refs/heads/main/apis.yml
