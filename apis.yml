- name: Classy Login (OpenID Connect SSO)
  description: >-
    GoFundMe Pro's single sign-on service, implemented against OpenID Connect, letting third-party apps
    register and log people in with their Classy/GoFundMe Pro account. Authorization endpoint at
    login.classy.org/authorize, token endpoint at api.classy.org/oauth2/auth, userinfo at
    api.classy.org/2.0/me. Supports redirect, popup and iframe flows via a JavaScript SDK.
  humanURL: https://developers.gofundme.com/pro/api-docs/login
  baseURL: https://login.classy.org
  tags:
  - Authentication
  - Single Sign-On
  - OpenID Connect
  - Identity
  - Nonprofit
  properties:
  - type: Documentation
    url: https://developers.gofundme.com/pro/api-docs/login
  - type: OpenIDConnect
    url: https://developers.gofundme.com/pro/api-docs/login
- name: Classy Pay
  description: >-
    Payment and embedded-checkout service behind GoFundMe Pro donation and registration flows. Ships a
    JavaScript embedded-checkout library (classypay.js) that renders a hosted checkout form into a host
    page and returns the full transaction response minus sensitive payment data, plus a REST API for
    transactions, voids and refunds. Publishes a separate staging environment for integration testing.
  humanURL: https://developers.gofundme.com/pro/api-docs/pay
  baseURL: https://pay.classy.org
  tags:
  - Payments
  - Checkout
  - Donations
  - Embedded Components
  properties:
  - type: Documentation
    url: https://developers.gofundme.com/pro/api-docs/pay
  - type: Components
    url: components/gofundme-components.yml
