- aid: gofundme:gofundme-transaction-api
  name: GoFundMe Transaction API
  description: >-
    Transactions have three types of attributes relating to Passport: raw, charged, and normalized.


    Raw attributes reflect the donor/purchaser's intent when creating the Transaction. The only attribute
    directly specified on the Transaction is `raw_currency_code` - the other visible attributes (`raw_total_gross_amount`,
    `raw_donation_gross_amount`, and  `raw_overhead_net_amount`) are all derived from the raw values set
    on the transaction's items.


    Charged attributes reflect the values that are actually charged when the payment is processed. Since
    the potential values for a Transaction's `charged_currency_code` should be limited to those available
    to an Organization for processing, this value can differ from the Transaction's `raw_currency_code`.
    The amount that is charged is reflected in `charged_total_gross_amount`, while the fees are expressed
    in `charged_classy_fees_amount` and `charged_pp_fees_amount` (`charged_fees_amount` attribute is the
    sum of these two attributes). There is additionally a `charged_at` timestamp that is used for normalization.


    Normalized attributes reflect a conversion from raw and/or charged attributes into the Transaction's
    `currency_code`, which is the same for all Passport-enabled entities associated with the Transaction's
    Organization. This normalization occurs to allow for a constant basis of comparison across each of
    these entities. These normalized values are all converted from the associated raw or charged attributes,
    preferring the charged attribute over the raw attribute if available. For example, `charged_total_gross_amount`
    will be used instead of `raw_total_gross_amount` if both `charged_total_gross_amount` and `charged_currency_code`
    are present. If `charged_at` is also present, the exchange rate between `charged_currency_code` and
    `currency_code` at that time will be used if/when the Transaction is renormalized.


    It should be noted that there is no notion of raw fees, as these are calculated at the time that a
    Transaction is charged and therefore only reflected as charged attributes. If a transaction is flagged
    as 'fee-on-top', this will be reflected by an increase in the `charged_total_gross_amount` that will
    not be visible in `raw_total_gross_amount`.


    Transactions may be in a number of different states: success, incomplete, canceled, refunded, cb_initiated,
    cb_lost, test, pending, failed


    An additional transaction attribute relating to Passport is the `tax_entity_id`. Tax entities indicate
    that an Organization is tax compliant within a certain country. A single organization may have more
    than one tax entity. The `tax_entity_id` listed on the Transaction indicates which of the Organization's
    tax entities indicates the tax compliance of the Transaction.


    Transactions may have an associated 'context' attribute which provides data about the Transaction's
    original Campaign (this does not change between hard credit transfers) and whether or not the transaction
    is considered to incorporate Passport functionality. This attribute can be used for filtering and/or
    sorting when using index endpoints.
  humanURL: https://developers.gofundme.com/pro/docs
  baseURL: https://pro.gofundme.com/api/2.0
