  name: GoFundMe Matched Transaction API
  description: >-
    A matched transaction can be created when a normal transaction may be matched with a future transaction.  This
    might

    occur in the case of an employer match, a sponsor pledge, or some other form of matching gift.  The
    matching

    transaction, once confirmed, will create an additional hard credit to the same entity that received
    the original

    transaction.  This credit is recognized in reporting and on the fundraiser/team/campaign total_raised
    metric, but

    funds may not yet be received.  Funds received for a matching transaction can be managed through its
    Cash Ledger

    (See Cash Ledger)
