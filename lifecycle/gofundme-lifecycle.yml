gaps:
- >-
  The published deprecation schedule has not been updated since 2016 — it still lists only the v1/v2
  transition and carries no sunset dates for the 54 operations the OpenAPI marks `deprecated: true`.
  A reader cannot tell when any deprecated operation will be removed.
- >-
  No Sunset or Deprecation response headers (RFC 8594) are emitted or documented, so a client cannot
  detect deprecation at runtime.
