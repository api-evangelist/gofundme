notes: >-
  GoFundMe Pro's first-party client libraries are published under the legacy Classy names in the
  classy-org GitHub organization. Both are long-unmaintained relative to the API: the npm package
  last shipped in 2019 and the Packagist package tops out at 1.2.0. There is no first-party SDK for
  Python, Go, Java, Ruby, .NET or Rust, and no maintained TypeScript client — a real gap against a
  290-operation OpenAPI. Registry probes for @classy/* and @gofundme/* scopes returned nothing.
