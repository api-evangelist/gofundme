  (2) {"errors": ["<string>", ...]} — MalformedPayloadResponse and other 400s;
  (3) {"success": false, "message": "<string>"} — used by the newer report/annual-summary,
      Chariot and consumer-mapping operations.
  There is no machine-readable error code vocabulary; clients must branch on HTTP status.
