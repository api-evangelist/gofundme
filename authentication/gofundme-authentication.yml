evidence:
- fetched: '2026-08-04'
  url: https://api.classy.org/oauth2/auth
  method: POST
  http_status: 400
  body_excerpt: >-
    {"error":{"client_id":["The client id field is required."],"secret_key":["The secret key field
    is required when client secret is not present."], ...}}
  conclusion: >-
    Confirms api.classy.org/oauth2/auth is the live token endpoint. The same POST against
    https://pro.gofundme.com/oauth2/auth returns a 403 CSRF page, and against
    https://pro.gofundme.com/api/2.0/oauth2/auth returns 401 invalid_request — so the relative
    tokenUrl declared in the spec does not resolve to a working endpoint under the declared server.

gaps:
- >-
  The spec's `tokenUrl` is the relative "/oauth2/auth"; resolved against the declared server it
  points at a host that does not serve the token endpoint. Generated clients will fail until the
  URL is overridden.
- The authorization_code grant is documented but not declared in the OpenAPI.
- >-
  Only two coarse scopes exist (read, write). There is no per-resource scope vocabulary, so an
  integration cannot be granted least privilege at the API layer — role/scope granularity exists
  only inside the product (CerberusRole/CerberusScope).
- No OIDC discovery document for Classy Login.
- No mutual TLS, no API-key alternative, no signed-request option.
