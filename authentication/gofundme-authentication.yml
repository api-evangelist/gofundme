  methods: [POST]
  content_types: [application/x-www-form-urlencoded, application/json]
  parameter_location: request body (never the query string)
  response:
    access_token: string
    expires_in: 3600
    token_type: bearer
  presentation: Authorization request header
  expiry_behaviour: >-
    Re-request a token when expires_in elapses; no refresh token is documented for the
    client_credentials grant.

grants:
- grant_type: client_credentials
  produces: app access token
  scope: read + write on resources belonging to the app's organization
- grant_type: authorization_code
  produces: member access token
  prerequisite: member consent obtained through the Classy Login flow
  exchange_params: [grant_type, client_id, client_secret, code]
- grant_type: password
  produces: member access token
  note: Declared in the OpenAPI and referenced in the v2 migration guide.

