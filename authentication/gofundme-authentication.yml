credentials:
  fields:
  - {name: client_id, description: 'Unique string identifying the application, e.g. "75651c06c1056579497b957715144ea0".'}
  - {name: client_secret, description: Paired secret; must never be shared, hard-coded, committed or sent as a query-string parameter.}
  - {name: secret_key, description: Legacy alias for client_secret accepted by the token endpoint (observed in the endpoint's own validation error).}
  issuance: >-
    Pro and Enterprise customers self-serve credentials from GoFundMe Pro > Apps & Integrations >
    API — name the app, supply an OAuth2 redirect URI, accept the terms, create. Third-party
    developers, free-plan users and consultants must request access through the partner team form.
  request_access: https://developers.gofundme.com/pro/overview/request-access
  editable: Application name and redirect URI can be edited later under My Settings > GoFundMe Pro API.

token:
